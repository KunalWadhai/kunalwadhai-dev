    <!--
      THEME SCRIPT — runs before first paint to prevent flash of wrong theme.
      Reads the localStorage preference when storage is available; falls back to system preference.
      Deliberately tiny — no external deps, no module scope.
    -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem('theme');
        } catch (error) {
          // Storage can be disabled or unavailable in sandboxed documents.
        }
        var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = stored === 'dark' || stored === 'light' ? stored : sys;
        document.documentElement.setAttribute('data-theme', theme);
        // Patch meta theme-color to match resolved theme
        var mc = document.querySelector('meta[name="theme-color"][media*="dark"]');
        if (mc && theme === 'light') mc.setAttribute('content', '#f8f8fc');
      })();
    </script>
